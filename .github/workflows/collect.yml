# Collecte planifiée : cotes Polymarket chaque heure, sondages et notices une fois par jour (6 h UTC).
# Les serveurs GitHub sont hors de France, donc Polymarket y est joignable.
# Secret requis : DATABASE_URL (Supabase > Connect > Session pooler, avec le mot de passe de la base).
name: Collecte

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      sondages:
        description: "Mettre aussi à jour les sondages et les notices"
        type: boolean
        default: false
      historique_polygon:
        description: "Reconstruire les cotes des anciens marchés depuis Polygon (ex. --election fr-2022), au lieu de la collecte"
        type: string
        default: ""

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECT_POLLS: ${{ inputs.sondages && '1' || '0' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vérifier le secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL manquant : Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Collecter
        if: ${{ !inputs.historique_polygon }}
        run: python -m collector scheduled

      - name: Reconstruire les anciennes cotes Polymarket
        if: ${{ inputs.historique_polygon }}
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          ARGS: ${{ inputs.historique_polygon }}
        run: python -m collector polymarket-legacy $ARGS --quiet
