# Collecte planifiée : cotes Polymarket chaque heure, sondages et notices à 6, 12 et 18 h UTC (élections en cours).
# Les serveurs GitHub sont hors de France, donc Polymarket y est joignable.
# Secret requis : DATABASE_URL (Supabase > Connect > Session pooler, avec le mot de passe de la base).
name: Collecte

on:
  schedule:
    - cron: "23 * * * *"  # loin de l'heure pile, où GitHub saute le plus de passages
  workflow_dispatch:
    inputs:
      sondages:
        description: "Mettre aussi à jour les sondages et les notices, toutes élections comprises"
        type: boolean
        default: false
      historique_polygon:
        description: "Reconstruire les cotes des anciens marchés depuis Polygon (ex. --election fr-2022), au lieu de la collecte"
        type: string
        default: ""
      recherche_polymarket:
        description: "Lister les événements Polymarket répondant à ces requêtes (ex. --query argentina), sans rien écrire"
        type: string
        default: ""
      articles_medias:
        description: "Relever les articles de sondage des chaînes (ex. --media BFMTV --since 2025-01-01), au lieu de la collecte"
        type: string
        default: ""

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # relevé complet des articles d'une chaîne
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECT_POLLS: ${{ inputs.sondages && '1' || '0' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vérifier le secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL manquant : Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Collecter
        if: ${{ !inputs.historique_polygon && !inputs.recherche_polymarket && !inputs.articles_medias }}
        run: python -m collector scheduled

      - name: Reconstruire les anciennes cotes Polymarket
        if: ${{ inputs.historique_polygon }}
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          ARGS: ${{ inputs.historique_polygon }}
        run: python -m collector polymarket-legacy $ARGS --quiet

      - name: Chercher des événements Polymarket
        if: ${{ inputs.recherche_polymarket }}
        env:
          ARGS: ${{ inputs.recherche_polymarket }}
        run: python -m collector polymarket-search $ARGS

      - name: Relever les articles de sondage des chaînes
        if: ${{ inputs.articles_medias }}
        env:
          ARGS: ${{ inputs.articles_medias }}
        run: python -m collector media $ARGS --quiet
